name: Stage npm Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lean Platform
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm with staged publishing support
        run: npm install --global npm@^11.21.0

      - name: Install package dependencies
        run: npm ci

      - name: Resolve exact component pins
        id: pins
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('assets/components.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `core=${data.components.core.commit}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment=${data.components.deployment.commit}\n`);
          NODE

      - name: Checkout exact Core source
        uses: actions/checkout@v6
        with:
          repository: mriekki/lean-agentic-core
          ref: ${{ steps.pins.outputs.core }}
          path: .release-sources/core
          token: ${{ secrets.LEAN_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Checkout exact Deployment Kit source
        uses: actions/checkout@v6
        with:
          repository: mriekki/lean-poc-deployment-kit
          ref: ${{ steps.pins.outputs.deployment }}
          path: .release-sources/deployment
          token: ${{ secrets.LEAN_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Prepare reproducible release candidate
        run: >-
          node scripts/prepare-release.mjs
          --core-root .release-sources/core
          --deployment-root .release-sources/deployment

      - name: Stage exact package on npm
        shell: bash
        run: |
          TARBALL="$(node -e "const m=require('./dist/release/RELEASE_MANIFEST.json'); process.stdout.write(m.tarball.filename)")"
          npm stage publish "dist/release/${TARBALL}" --access public
