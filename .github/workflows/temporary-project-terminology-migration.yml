name: Temporary Project terminology migration

# One-use branch migration; removed after the deterministic commit.
on:
  push:
    branches:
      - feature/project-terminology-migration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-terminology-migration
          fetch-depth: 0
      - name: Build Project-only active ChatGPT contract v6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chatgpt/contracts/v6
          cp -R chatgpt/contracts/v5 chatgpt/contracts/v6
          mv chatgpt/contracts/v6/NEW_POC.md chatgpt/contracts/v6/NEW_PROJECT.md
          mv chatgpt/contracts/v6/EXISTING_POC.md chatgpt/contracts/v6/EXISTING_PROJECT.md
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          active = [
              Path('WELCOME.md'),
              Path('chatgpt/SETUP.md'),
              Path('chatgpt/START_HERE.md'),
              Path('chatgpt/HANDOFF_MIGRATION.md'),
              *sorted(Path('chatgpt/contracts/v6').glob('*')),
          ]
          for p in active:
              if not p.is_file():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('POCs', 'Projects').replace('POC', 'Project')
              text = text.replace('poc-author', 'project-author')
              text = text.replace('poc-', 'project-').replace('poc_', 'project_')
              text = text.replace('contracts/v5', 'contracts/v6')
              text = re.sub(r'(?m)^(New Project: <idea>)\n\1$', r'\1', text)
              text = text.replace('`New Project: <your idea>` is also accepted and enters the same Project Discovery protocol.\n', '')
              p.write_text(text, encoding='utf-8')

          current_path = Path('chatgpt/current.json')
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current['contractVersion'] = 6
          current['snapshotPath'] = 'chatgpt/contracts/v6'
          names = [
              'ADMIN.md', 'EXISTING_PROJECT.md', 'NEW_PROJECT.md', 'ONBOARDING.md',
              'PROJECT_INSTRUCTIONS.md', 'PROJECT_RULES.md', 'USER_PROFILE.schema.json'
          ]
          docs = []
          for name in names:
              path = Path('chatgpt/contracts/v6') / name
              docs.append({
                  'path': str(path).replace('\\', '/'),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          current['documents'] = docs
          current_path.write_text(json.dumps(current, indent=2) + '\n', encoding='utf-8')

          test_path = Path('test/chatgpt-contract.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('contract v5', 'contract v6')
          test = test.replace('contractVersion, 5', 'contractVersion, 6')
          test = test.replace("'chatgpt/contracts/v5'", "'chatgpt/contracts/v6'")
          test = test.replace("'EXISTING_POC.md'", "'EXISTING_PROJECT.md'")
          test = test.replace("'NEW_POC.md'", "'NEW_PROJECT.md'")
          test = test.replace('assert.match(joined, /New POC:/);\n', '')
          test = test.replace('/mriekki\\/project-forge-platform\\/main\\/chatgpt\\/contracts\\/v5/', '/mriekki\\/project-forge-platform\\/main\\/chatgpt\\/contracts\\/v6/')
          test = test.replace("for (const retired of ['accept-lean', 'lean-doctor', 'lean-platform', 'Lean POC Generator'])", "for (const retired of ['accept-lean', 'lean-doctor', 'lean-platform'])")
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Forge Migration"
          git config user.email "mriekki@users.noreply.github.com"
          git add -A
          git commit -m "Publish Project-only ChatGPT contract v6" || exit 0
          git push origin HEAD:feature/project-terminology-migration
